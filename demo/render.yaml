services:
  - type: web
    name: face-verification-api
    runtime: python
    plan: free
    rootDir: demo
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TORCH_THREADS
        value: "1"
      - key: HF_HOME
        value: /tmp/hf
